<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Gossiper status</title>
<link rel="icon" href="data:,">
<script type="module" src="/src/ui.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
<noscript><p class="p-4 text-sm">This page needs JavaScript. Its data is at <a class="underline" href="/ui/status.json">/ui/status.json</a>.</p></noscript>

<main x-data="status" x-cloak class="mx-auto max-w-5xl px-4 py-4 sm:py-6">
  <header class="flex flex-wrap items-center gap-x-3 gap-y-2">
    <h1 class="text-lg font-semibold tracking-tight">Gossiper</h1>
    <span class="badge" :class="readinessClass()" x-text="readinessLabel()"></span>
    <span class="text-xs text-muted" x-show="data" x-text="modeLabel()"></span>
    <button type="button" class="ml-auto btn" @click="toggleTheme" :aria-label="themeLabel()" :title="themeLabel()">
      <svg x-show="dark" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg x-show="!dark" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <p x-show="error" class="mt-3 rounded-md border border-red-300 bg-red-50 px-3 py-2 text-sm text-red-800 dark:border-red-500/40 dark:bg-red-500/10 dark:text-red-200" x-text="error"></p>

  <section class="mt-4 grid grid-cols-2 gap-2 sm:gap-3 md:grid-cols-4" aria-label="Statistics">
    <template x-for="t in tiles()" :key="t.label">
      <div class="card px-3 py-2.5">
        <div class="text-xs text-muted" x-text="t.label"></div>
        <div class="mt-0.5 text-xl font-semibold tabular-nums" x-text="t.value"></div>
        <div class="truncate text-xs text-muted tabular-nums" x-text="t.sub"></div>
      </div>
    </template>
  </section>

  <section class="card mt-4 overflow-hidden" aria-labelledby="nodes-h">
    <div class="flex items-baseline justify-between px-3 py-2">
      <h2 id="nodes-h" class="text-sm font-semibold">Nodes</h2>
      <span class="text-xs text-muted tabular-nums" x-text="nodesSummary()"></span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="border-y border-slate-200 bg-slate-50 text-xs text-muted dark:border-slate-800 dark:bg-slate-900/60">
          <tr><th class="px-3 py-1.5 font-medium">ID</th><th class="px-3 py-1.5 font-medium">State</th><th class="px-3 py-1.5 font-medium">Since</th></tr>
        </thead>
        <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
          <template x-for="n in nodes()" :key="n.id">
            <tr>
              <td class="px-3 py-1.5 font-mono text-xs">
                <span class="break-all" x-text="n.id || '—'"></span>
                <span x-show="n.local" class="ml-1 font-sans text-muted">(this node)</span>
              </td>
              <td class="px-3 py-1.5"><span class="badge" :class="stateClass(n.state)" x-text="n.state"></span></td>
              <td class="whitespace-nowrap px-3 py-1.5 text-xs text-muted tabular-nums" x-text="ago(n.since)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </section>

  <div class="mt-4 grid gap-4 md:grid-cols-2">
    <section class="card px-3 py-2" aria-labelledby="counters-h">
      <h2 id="counters-h" class="text-sm font-semibold">Counters</h2>
      <dl class="mt-1 grid gap-x-4 text-sm sm:grid-cols-2">
        <template x-for="c in counters()" :key="c.label">
          <div class="flex justify-between gap-2 border-b border-slate-100 py-1 dark:border-slate-800/70">
            <dt class="text-muted" x-text="c.label"></dt>
            <dd class="tabular-nums" :class="c.warn ? 'font-semibold text-amber-700 dark:text-amber-300' : ''" x-text="c.value"></dd>
          </div>
        </template>
      </dl>
    </section>

    <section class="card px-3 py-2" aria-labelledby="store-h">
      <h2 id="store-h" class="text-sm font-semibold">Tenant database and replication</h2>
      <p x-show="data && !data.store" class="mt-1 text-sm text-muted">No tenant database: the admin API is off.</p>
      <dl class="mt-1 grid gap-x-4 text-sm sm:grid-cols-2">
        <template x-for="c in storeRows()" :key="c.label">
          <div class="flex justify-between gap-2 border-b border-slate-100 py-1 dark:border-slate-800/70">
            <dt class="text-muted" x-text="c.label"></dt>
            <dd class="tabular-nums" :class="c.warn ? 'font-semibold text-amber-700 dark:text-amber-300' : ''" x-text="c.value"></dd>
          </div>
        </template>
      </dl>
    </section>
  </div>

  <footer class="mt-4 flex flex-wrap gap-x-4 gap-y-1 text-xs text-muted">
    <span x-text="versionLabel()"></span>
    <span x-text="updatedLabel()"></span>
  </footer>
</main>
</body>
</html>
