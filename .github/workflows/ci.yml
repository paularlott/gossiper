name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the API description and reference (lints the OpenAPI description)
        run: cd web && npm ci --no-audit --no-fund --ignore-scripts && npm run build
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./... && (cd client && go vet ./...)
      - name: Test
        run: go test -race -count=1 -cover ./...
      - name: Test the client module (against the hub, run as a process)
        run: cd client && go test -race -count=1 -cover ./...

  compat:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start the compatibility stack
        run: docker compose -f test/compat/docker-compose.yml up -d --build --wait
      - name: Compatibility tests
        run: go test -tags compat -count=1 -v ./test/compat/
      - name: Logs
        if: failure()
        run: docker compose -f test/compat/docker-compose.yml logs
