version: "3"

# Local settings (gitignored, see .env.example): the macOS signing identity and notary key, and the local registry.
dotenv: [".env"]

vars:
  PROJECT_NAME: gossiper
  MAIN: ./cmd/gossiper
  PLATFORMS:
    - linux/amd64
    - linux/arm64
    - darwin/amd64
    - darwin/arm64
    - windows/amd64
    - windows/arm64
  BUILT_AT:
    sh: date +%Y%m%d.%H%M%S%z
  BUILD_FLAGS: '-ldflags="-s -w -X github.com/paularlott/gossiper/build.Date={{.BUILT_AT}}" -trimpath'
  OUTPUT_DIR: bin
  VERSION:
    sh: go run ./scripts/getversion
  REGISTRY: '{{.REGISTRY | default "paularlott"}}'
  HUB: '{{.HUB | default "registry-1.docker.io/"}}'
  BUILD_WITH:
    sh: |
      if [ -n "${BUILD_WITH}" ]; then
        echo "${BUILD_WITH}"
      elif command -v docker >/dev/null 2>&1; then
        echo "docker"
      elif command -v podman >/dev/null 2>&1; then
        echo "podman"
      elif command -v container >/dev/null 2>&1; then
        echo "apple"
      else
        echo "none"
      fi
  PLATFORM_ARG: "--platform linux/amd64,linux/arm64"

tasks:
  default:
    desc: Build the binary for all platforms (default task)
    deps: [all]

  webassets:
    desc: Build the API description and reference (web/dist, embedded in the binary) with Node.js
    dir: web
    run: once # several tasks depend on it, in parallel: one npm ci at a time
    cmds:
      - npm ci --no-audit --no-fund --ignore-scripts
      - npm run build
    sources:
      - openapi/**/*
      - api-docs/**/*
      - src/**/*
      - vite.config.js
      - redocly.yaml
      - package.json
      - package-lock.json
    generates:
      - dist/openapi.json

  apidocs-lint:
    desc: Lint the OpenAPI description (web/openapi/openapi.yaml) with Redocly CLI
    dir: web
    cmds:
      - npm run lint:api --silent

  build:
    desc: Build the binary for the current platform into bin/
    deps: [webassets]
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT_DIR}}/{{.PROJECT_NAME}}{{exeExt}} {{.MAIN}}
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - web/dist/**/*
    generates:
      - "{{.OUTPUT_DIR}}/{{.PROJECT_NAME}}{{exeExt}}"

  build-amd64:
    desc: Build the binary for linux/amd64 into bin/
    deps: [webassets]
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT_DIR}}/{{.PROJECT_NAME}} {{.MAIN}}

  build-arm64:
    desc: Build the binary for linux/arm64 into bin/
    deps: [webassets]
    env:
      GOOS: linux
      GOARCH: arm64
      CGO_ENABLED: "0"
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT_DIR}}/{{.PROJECT_NAME}} {{.MAIN}}

  all:
    desc: Build zipped binaries for every platform into bin/
    deps: [legal] # legal builds the web assets first
    cmds:
      - task: build-platform
        vars: { PLATFORM: "{{.ITEM}}" }
        for:
          var: PLATFORMS

  build-platform:
    internal: true
    label: "Building for {{.PLATFORM}}"
    vars:
      GOOS: '{{splitList "/" .PLATFORM | first}}'
      GOARCH: '{{splitList "/" .PLATFORM | last}}'
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
      ZIP_FILE: "{{$.PROJECT_NAME}}_{{.GOOS}}_{{.GOARCH}}.zip"
      STAGE: "{{$.OUTPUT_DIR}}/{{.GOOS}}_{{.GOARCH}}"
    env:
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
      CGO_ENABLED: "0"
    # MACOS_SIGN_IDENTITY (see .env.example) signs the macOS binaries for release.
    dotenv: [".env"]
    cmds:
      - rm -rf {{.STAGE}} {{$.OUTPUT_DIR}}/{{.ZIP_FILE}}
      - mkdir -p {{.STAGE}}
      - go build {{$.BUILD_FLAGS}} -o {{.STAGE}}/{{$.PROJECT_NAME}}{{.EXT}} {{$.MAIN}}
      - |
        # Developer ID signature for release: the hardened runtime and a secure
        # timestamp are required for notarization. Skipped without an identity
        # (or off macOS), leaving Go's ad-hoc signature.
        if [ "{{.GOOS}}" = "darwin" ] && [ -n "$MACOS_SIGN_IDENTITY" ] && command -v codesign >/dev/null 2>&1; then
          codesign --force --timestamp --options runtime --identifier com.paularlott.{{$.PROJECT_NAME}} \
            --sign "$MACOS_SIGN_IDENTITY" {{.STAGE}}/{{$.PROJECT_NAME}} || exit 1
        fi
      - cp LICENSE.txt THIRD_PARTY_LICENSES.txt README.md {{.STAGE}}/
      - cd {{.STAGE}} && zip -q ../{{.ZIP_FILE}} {{$.PROJECT_NAME}}{{.EXT}} LICENSE.txt THIRD_PARTY_LICENSES.txt README.md
      - rm -rf {{.STAGE}}
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
      - web/dist/**/*
      - THIRD_PARTY_LICENSES.txt
    generates:
      - "{{$.OUTPUT_DIR}}/{{.ZIP_FILE}}"

  notarize-macos:
    desc: Notarize the Developer ID signed macOS binaries in bin/ (NOTARY_* in .env)
    dotenv: [".env"]
    cmds:
      - |
        if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
          echo "NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER must be set: see .env.example" >&2
          exit 1
        fi
        key=$NOTARY_KEY
        case $key in "~/"*) key="$HOME/${key#\~/}" ;; esac
        if [ ! -f "$key" ]; then
          echo "Notary API key not found: $key" >&2
          exit 1
        fi
        notary() {
          xcrun notarytool "$@" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
        }

        stage=$(mktemp -d "${TMPDIR:-/tmp}/{{.PROJECT_NAME}}-notarize.XXXXXX") || exit 1
        trap 'rm -rf "$stage"' EXIT

        # Unpack each macOS binary from its release zip (with unzip, as users
        # and Homebrew do) and check it carries a Developer ID signature before
        # anything is sent to Apple.
        for arch in amd64 arm64; do
          zip="{{.OUTPUT_DIR}}/{{.PROJECT_NAME}}_darwin_${arch}.zip"
          mkdir -p "$stage/unpack/$arch" "$stage/submit/$arch" || exit 1
          unzip -q "$zip" {{.PROJECT_NAME}} -d "$stage/unpack/$arch" || exit 1
          bin="$stage/unpack/$arch/{{.PROJECT_NAME}}"
          if ! codesign -dvv "$bin" 2>&1 | grep -q '^Authority=Developer ID Application'; then
            echo "$zip is not Developer ID signed: set MACOS_SIGN_IDENTITY in .env and rebuild (task clean all)" >&2
            exit 1
          fi
          cp "$bin" "$stage/submit/$arch/" || exit 1
        done

        # One submission covers both binaries: notarization is recorded per
        # binary (by code hash), not per zip, so the release zips need no
        # change. Bare binaries cannot be stapled; Gatekeeper finds the ticket
        # online.
        ditto -c -k --keepParent "$stage/submit" "$stage/submit.zip" || exit 1
        result=$(notary submit "$stage/submit.zip" --wait --output-format json) || true
        echo "$result"
        status=$(echo "$result" | jq -r '.status // empty')
        if [ "$status" != "Accepted" ]; then
          id=$(echo "$result" | jq -r '.id // empty')
          echo "Notarization failed (status: ${status:-unknown})" >&2
          if [ -n "$id" ]; then notary log "$id" >&2; fi
          exit 1
        fi

        # Confirm Apple serves the ticket for the binaries as shipped.
        for arch in amd64 arm64; do
          bin="$stage/unpack/$arch/{{.PROJECT_NAME}}"
          ok=0
          # A freshly accepted ticket can take a few seconds to be served.
          for attempt in 1 2 3 4 5 6; do
            if codesign --verify --strict --check-notarization "$bin" 2>/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "The $arch binary is not showing as notarized" >&2
            exit 1
          fi
          echo "notarized: {{.PROJECT_NAME}}_darwin_${arch}"
        done

  checksums:
    desc: Write and show the SHA-256 checksums of the release archives
    cmds:
      - cd {{.OUTPUT_DIR}} && shasum -a 256 *.zip | tee checksums.txt

  version:
    desc: Show the version the release tasks will use
    cmds:
      - echo {{.VERSION}}

  test:
    desc: Run the unit and cluster tests, and the client module's
    cmds:
      - go test ./...
      - cd client && go test ./...

  test:race:
    desc: Run the unit and cluster tests, and the client module's, with the race detector
    cmds:
      - go test -race -count=1 ./...
      - cd client && go test -race -count=1 ./...

  test:compat:
    desc: Run the Mercure compatibility suite (FrankenPHP / Symfony, Docker)
    cmds:
      - docker compose -f test/compat/docker-compose.yml up -d --build --wait
      - defer: docker compose -f test/compat/docker-compose.yml down -v
      - go test -tags compat -count=1 -timeout 30m ./test/compat/

  test:conformance:
    desc: Run Mercure's conformance suite (fetched at run time, AGPL; needs Node.js) against a built gossiper
    deps: [build]
    cmds:
      - scripts/conformance.sh {{.CLI_ARGS}}

  test:failover:
    desc: Run the failover suite (real processes, kill -9 and restarts)
    cmds:
      - go test -tags failover -count=1 -timeout 20m ./test/failover/

  lint:
    desc: Check formatting and vet the code
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...
      - task: apidocs-lint

  legal:
    desc: Write the third-party notices (Go modules and bundled JavaScript) to THIRD_PARTY_LICENSES.txt (needs go-licenses)
    deps: [webassets]
    cmds:
      - scripts/licenses.sh > THIRD_PARTY_LICENSES.txt.tmp && mv THIRD_PARTY_LICENSES.txt.tmp THIRD_PARTY_LICENSES.txt
    sources:
      - go.mod
      - go.sum
      - web/dist/licenses.md
      - scripts/licenses.*
    generates:
      - THIRD_PARTY_LICENSES.txt

  clean:
    desc: Remove the build artifacts
    cmds:
      - find {{.OUTPUT_DIR}} -mindepth 1 ! -name .gitignore -exec rm -rf {} +
      - find web/dist -mindepth 1 ! -name .gitkeep -exec rm -rf {} +
      - rm -f THIRD_PARTY_LICENSES.txt

  run-server:
    desc: "Run a single test node: a Mercure hub at localhost:8080 (streaming publish too); the admin API and its docs, metrics and profiling on localhost:9090"
    deps: [webassets]
    vars:
      DEV_KEY: dev-publisher-key-not-for-production-0123456789
      API_TOKEN: dev-api-token
    cmds:
      - mkdir -p data
      - cmd: |
          echo "Hub:        https://localhost:8080/.well-known/mercure   (tenant \"dev\", examples/dev/tenants.json)"
          echo "Token:      go run {{.MAIN}} token --modern --key {{.DEV_KEY}} --publish '*' --subscribe '*'"
          echo "Admin API:  curl --cacert data/tls/self-signed.crt -H 'Authorization: Bearer {{.API_TOKEN}}' https://localhost:9090/api/tenants"
          echo "API docs:   https://localhost:9090/api-docs/   (accept the self-signed certificate)"
          echo "Metrics:    https://localhost:9090/metrics"
          echo "Profiling:  https://localhost:9090/debug/pprof/"
          echo "Database:   data/dev.db (delete it to start over); certificate: data/tls/self-signed.crt"
        silent: true
      - >-
        go run {{.MAIN}} serve --log-level=debug --metrics --pprof --admin-listen localhost:9090
        --tenants-file examples/dev/tenants.json
        --database data/dev.db --api-token {{.API_TOKEN}} --tls-dir data/tls
    ignore_error: true

  container:
    desc: Build the container image for linux/amd64 and linux/arm64 and push it to Docker Hub (REGISTRY) as :<version> and :latest
    method: none
    cmds:
      - task: container-build
        vars: { PUSH: "true" }

  container:local:
    desc: Build the container image for linux/amd64 and linux/arm64 and push it to the local registry (LOCAL_REGISTRY in .env) instead of Docker Hub
    method: none
    preconditions:
      - sh: test -n "$LOCAL_REGISTRY"
        msg: "set LOCAL_REGISTRY in .env (e.g. hub.anaconda.ovh/library): see .env.example"
    cmds:
      - task: container-build
        vars:
          PUSH: "true"
          REGISTRY: "{{.LOCAL_REGISTRY}}"
          # Pull the base images through the local registry's Docker Hub cache when LOCAL_HUB is set.
          HUB: '{{.LOCAL_HUB | default .HUB}}'

  container:check:
    desc: Build the container image for linux/amd64 and linux/arm64 without pushing it, to check it builds
    method: none
    cmds:
      - task: container-build
        vars: { PUSH: "false" }

  container-build:
    internal: true
    method: none
    cmds:
      - |
        echo "Detected container runtime: {{.BUILD_WITH}}"
        echo "Building for platforms: {{.PLATFORM_ARG}}"

        image="{{.REGISTRY}}/{{.PROJECT_NAME}}"
        tags="$image:{{.VERSION}} $image:latest"
        set -- $tags
        first=$1
        if [ "{{.PUSH}}" = "true" ]; then
          echo "Pushing: $tags"
        fi

        if [ "{{.BUILD_WITH}}" = "apple" ]; then
          container build \
            {{.PLATFORM_ARG}} \
            --tag "$first" \
            --build-arg BUILT_AT={{.BUILT_AT}} \
            --build-arg DOCKER_HUB={{.HUB}} \
            . || exit 1
          if [ "{{.PUSH}}" = "true" ]; then
            for tag in $tags; do
              if [ "$tag" != "$first" ]; then container image tag "$first" "$tag" || exit 1; fi
              container images push "$tag" || exit 1
            done
          fi
        elif [ "{{.BUILD_WITH}}" = "podman" ]; then
          podman manifest rm "$first" >/dev/null 2>&1 || true
          podman manifest create "$first" || exit 1
          podman build \
            {{.PLATFORM_ARG}} \
            --build-arg BUILT_AT={{.BUILT_AT}} \
            --build-arg DOCKER_HUB={{.HUB}} \
            --manifest "$first" \
            . || exit 1
          if [ "{{.PUSH}}" = "true" ]; then
            for tag in $tags; do
              podman manifest push "$first" "docker://$tag" || exit 1
            done
          fi
        elif [ "{{.BUILD_WITH}}" = "docker" ]; then
          tagargs=""
          for tag in $tags; do
            tagargs="$tagargs --tag $tag"
          done
          if [ "{{.PUSH}}" = "true" ]; then output="--push"; else output="--output=type=cacheonly"; fi
          docker buildx build \
            {{.PLATFORM_ARG}} \
            $tagargs \
            --build-arg BUILT_AT={{.BUILT_AT}} \
            --build-arg DOCKER_HUB={{.HUB}} \
            $output \
            . || exit 1
        else
          echo "No container runtime found (docker, podman or Apple container)" >&2
          exit 1
        fi

  release:
    desc: Test, build every platform, then tag, push the container, create the GitHub release and show the checksums
    preconditions:
      - sh: test -z "$(git status --porcelain)"
        msg: "the working tree has changes: commit or stash them first"
    cmds:
      - task: test:race
      - task: all
      # Before anything is tagged or published, so a rejection stops here.
      - task: notarize-macos
      - task: checksums
      - task: tag
      - task: container
      - task: create-release

  tag:
    desc: Tag the current commit with the version (v<version>) and push the tag
    cmds:
      - git tag -a v{{.VERSION}} -m "Release {{.VERSION}}"
      - git push origin v{{.VERSION}}
    status:
      - git tag -l v{{.VERSION}} | grep -q v{{.VERSION}}

  create-release:
    desc: Create the GitHub release with the archives and checksums
    internal: true
    cmds:
      - gh release create v{{.VERSION}} {{.OUTPUT_DIR}}/*.zip {{.OUTPUT_DIR}}/checksums.txt -t "Release {{.VERSION}}" -n "Gossiper {{.VERSION}}"
